# ============================================================
# Daemon L402 - AI Payment Agent Cluster Environment
# 来源: Vol.2 §2.6 S-P2-06, Task-P2-06
# ============================================================
#
# 启动方式:
#   docker-compose -f docker-compose.cluster.yml up -d --scale gateway=3
#
# 架构:
#   Nginx LB (port 3000) -> Gateway x3 -> Redis/Postgres
#
# 验证:
#   curl http://localhost:3000/health
#   docker-compose -f docker-compose.cluster.yml ps

services:
  # --------------------------------------------------------
  # Nginx Load Balancer
  # --------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.cluster.conf:/etc/nginx/nginx.conf:ro
    networks:
      - daemon_net
    depends_on:
      - gateway
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:80/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------
  # Lightning Network Daemon (核心支付节点)
  # --------------------------------------------------------
  lnd:
    image: lightninglabs/lnd:v0.18.0-beta
    container_name: lnd
    restart: unless-stopped
    environment:
      - NETWORK=${LND_NETWORK:-regtest}
    volumes:
      - lnd_data:/root/.lnd
      - ./lnd/lnd.conf:/root/.lnd/lnd.conf:ro
      - ./scripts:/scripts:ro
    ports:
      - "${LND_GRPC_PORT:-10009}:10009"
      - "${LND_REST_PORT:-8080}:8080"
    networks:
      - daemon_net
    depends_on:
      bitcoind:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "lncli", "--network=regtest", "getinfo" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      lnd --noseedbackup --bitcoin.regtest --listen=0.0.0.0:9735 --rpclisten=0.0.0.0:10009 --restlisten=0.0.0.0:8080

  # --------------------------------------------------------
  # Bitcoin Core (Regtest 后端)
  # --------------------------------------------------------
  bitcoind:
    image: ruimarinho/bitcoin-core:24
    container_name: bitcoind
    restart: unless-stopped
    environment:
      - BITCOIN_NETWORK=regtest
    volumes:
      - bitcoind_data:/home/bitcoin/.bitcoin
    ports:
      - "${BITCOIND_RPC_PORT:-18443}:18443"
      - "${BITCOIND_ZMQ_BLOCK:-28332}:28332"
      - "${BITCOIND_ZMQ_TX:-28333}:28333"
    networks:
      - daemon_net
    command:
      - -regtest
      - -server
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=daemon
      - -rpcpassword=daemonpass
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -fallbackfee=0.0001
    healthcheck:
      test: [ "CMD", "bitcoin-cli", "-regtest", "-rpcuser=daemon", "-rpcpassword=daemonpass", "getblockchaininfo" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # L402 Gateway (API 网关 + 支付拦截) - 集群模式
  # 注意: 移除 container_name 以支持 replicas
  # --------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - LND_GRPC_HOST=lnd:10009
      - LND_MACAROON_HEX=${LND_MACAROON_HEX}
      - LND_TLS_CERT_PATH=/lnd/tls.cert
      - L402_SECRET_KEY=${L402_SECRET_KEY}
      - INVOICE_PRICE_MSATS=${INVOICE_PRICE_MSATS:-1000}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/daemon
      - REDIS_URL=redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379
    volumes:
      - lnd_data:/lnd:ro
    # 不直接暴露端口，通过 Nginx 访问
    networks:
      - daemon_net
    depends_on:
      lnd:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3

  # --------------------------------------------------------
  # PostgreSQL (元数据存储)
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=daemon
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - daemon_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Redis (Macaroon 缓存 + Session + Rate Limit)
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - daemon_net

# ============================================================
# Networks (容器间通信)
# ============================================================
networks:
  daemon_net:
    driver: bridge
    name: daemon_network

# ============================================================
# Volumes (数据持久化)
# ============================================================
volumes:
  lnd_data:
    name: daemon_lnd_data
  bitcoind_data:
    name: daemon_bitcoind_data
  postgres_data:
    name: daemon_postgres_data
  redis_data:
    name: daemon_redis_data
