# ============================================
# LND Configuration for Daemon L402 Gateway
# ============================================
# 来源: Vol.0 §4 Network Architecture
# 网络: Regtest (本地开发)
# ============================================

[Application Options]
# 节点别名
alias=daemon-lnd-regtest

# 日志级别
debuglevel=info

# 监听地址
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080

# TLS 证书额外域名 (容器名)
tlsextradomain=lnd
tlsextraip=0.0.0.0

# 允许的 CORS 源 (REST API)
restcors=*

# 无种子备份 (测试环境)
noseedbackup=true

[Bitcoin]
# 使用 Bitcoin 作为链
bitcoin.active=1

# Regtest 本地测试网
bitcoin.regtest=1

# 使用内置 bitcoind 后端
bitcoin.node=bitcoind

[Bitcoind]
# 连接到本地 bitcoind (测试模式下使用 mock)
bitcoind.rpchost=127.0.0.1:18443
bitcoind.rpcuser=daemon
bitcoind.rpcpass=daemonpass
bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332
bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333

[autopilot]
# 禁用自动通道管理 (手动控制)
autopilot.active=0

[wtclient]
# 禁用瞭望塔客户端 (测试环境)
wtclient.active=0
