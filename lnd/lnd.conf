# ============================================
# LND Configuration for Daemon L402 Gateway
# ============================================
# 来源: Vol.0 §4 Network Architecture
# 网络: Regtest (本地开发)
# ============================================

[Application Options]
# 节点别名
alias=daemon-lnd-regtest

# 日志级别
debuglevel=info

# 监听地址
listen=0.0.0.0:9735
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080

# TLS 证书额外域名 (容器名)
tlsextradomain=lnd
tlsextraip=0.0.0.0

# 允许的 CORS 源 (REST API)
restcors=*

# 无种子备份 (测试环境)
noseedbackup=true

[Bitcoin]
# 使用 Bitcoin 作为链
bitcoin.active=1

# Regtest 本地测试网 (开发模式)
bitcoin.regtest=1

# 使用 bitcoind 后端 (Phase 2 生产模式)
bitcoin.node=bitcoind

[Bitcoind]
# 连接到 bitcoind 容器
bitcoind.rpchost=bitcoind:18443
bitcoind.rpcuser=daemon
bitcoind.rpcpass=daemonpass
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333

[autopilot]
# 禁用自动通道管理 (手动控制)
autopilot.active=0

[wtclient]
# 禁用瞭望塔客户端 (测试环境)
wtclient.active=0
